include:
  - ../UserRepositoryService/docker-compose.yaml

services:
  usermanagementservice:
    build:
      context: ../../
      dockerfile: components/UserManagementService/src/private/UserManagementService/Dockerfile
    container_name: microservice0-management
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      GrpcClients__UserRepositoryService: "http://userrepositoryservice:8080"
    ports:
      - "8082:8080"
    depends_on:
      userrepositoryservice:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8081/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - microservice0-network

networks:
  microservice0-network:
    name: microservice0-network
    driver: bridge
