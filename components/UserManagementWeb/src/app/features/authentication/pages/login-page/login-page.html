<div class="login-page d-flex align-items-center justify-content-center">
  <div class="card shadow-sm" style="width: 24rem">
    <div class="card-body">
      <h1 class="card-title h4 mb-3 text-center">User Management</h1>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            id="username"
            type="text"
            class="form-control"
            formControlName="username"
            autocomplete="username"
            [class.is-invalid]="form.controls.username.invalid && form.controls.username.touched"
          />
          @if (form.controls.username.invalid && form.controls.username.touched) {
            <div class="invalid-feedback">Username is required.</div>
          }
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            id="password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
          />
          @if (form.controls.password.invalid && form.controls.password.touched) {
            <div class="invalid-feedback">Password is required.</div>
          }
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
    </div>
  </div>
</div>
