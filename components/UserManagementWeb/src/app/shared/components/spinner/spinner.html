@if (overlay()) {
  <div class="spinner-overlay d-flex align-items-center justify-content-center" role="status" aria-live="polite">
    <div class="spinner-border text-primary" [attr.aria-label]="label()">
      <span class="visually-hidden">{{ label() }}</span>
    </div>
  </div>
} @else {
  <div class="spinner-border spinner-border-sm text-primary" role="status" [attr.aria-label]="label()">
    <span class="visually-hidden">{{ label() }}</span>
  </div>
}
