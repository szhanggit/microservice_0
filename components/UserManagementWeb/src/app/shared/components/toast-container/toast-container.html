<div class="toast-stack position-fixed top-0 end-0 p-3" style="z-index: 1090" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <div class="toast show mb-2" [class]="variantClass(toast.variant)" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">{{ toast.message }}</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Close"
          (click)="dismiss(toast.id)"
        ></button>
      </div>
    </div>
  }
</div>
