# Mirrors proxy.conf.json (used by `ng serve` in local dev): the browser only
# ever talks to this origin, and /users (the gateway's REST API) is proxied
# server-side to the usermanagementgateway container. That keeps every
# environment - dev proxy and this container - on the same "no CORS needed,
# same-origin API calls" architecture. See UserApiService/API_ENDPOINTS in
# the Angular app for the client side of this contract.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /users {
        proxy_pass http://usermanagementgateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://usermanagementgateway:8080;
    }

    # Angular's client-side router owns every other path - let it 404 within
    # the app instead of nginx 404ing on a deep link like /users/create.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
