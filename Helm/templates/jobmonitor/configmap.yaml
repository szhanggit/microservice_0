apiVersion: v1
kind: ConfigMap
metadata:
  name: jobmonitor-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservice0.labels" (dict "name" "jobmonitor" "component" "batch") | nindent 4 }}
data:
  # Random delay range (seconds) the job sleeps for on each run, deliberately
  # allowed to exceed the 60s schedule interval - see cronjob.yaml's
  # concurrencyPolicy: Forbid for how overlapping triggers are handled.
  JobDelay__MinSeconds: {{ .Values.jobmonitor.jobDelay.minSeconds | quote }}
  JobDelay__MaxSeconds: {{ .Values.jobmonitor.jobDelay.maxSeconds | quote }}
