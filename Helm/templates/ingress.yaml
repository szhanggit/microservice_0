# Routes external traffic to the gateway Service only - dataaccess and management
# are internal-only gRPC services and are never exposed outside the cluster.
#
# ingressClassName: alb targets the AWS Load Balancer Controller (its IAM role
# provisioned via terraform/modules/eks-alb-controller, the controller itself
# installed via kubernetes/scripts/install-alb-controller.sh), which creates a
# real internet-facing Application Load Balancer for this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice0
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: microservice0
  annotations:
    # Load Balancer Name
    alb.ingress.kubernetes.io/load-balancer-name: {{ .Values.ingress.loadBalancerName }}
    # Health Check Settings
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    # Important Note: Need to add health check path annotations in service level if we are planning to use multiple targets in a load balancer
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    ## SSL Settings
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    # SSL Redirect Setting
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # External DNS - For creating a Record Set in Route53
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.ingress.domain }}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
