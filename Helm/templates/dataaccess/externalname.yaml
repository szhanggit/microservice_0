# Demonstrates the standard Kubernetes ExternalName pattern: gives the RDS
# instance terraform/ provisions a stable in-cluster DNS name,
# mysql.microservice0.svc.cluster.local, which just CNAMEs to the real RDS
# endpoint. Not required for dataaccess to function - its
# ConnectionStrings__MySql Secret already carries the real RDS endpoint
# directly (see kubernetes/scripts/apply-db-secret.sh) - this Service exists
# purely to demo the pattern, e.g.:
#   kubectl run -it --rm dnsutils --image=ghcr.io/dvarnier/dnsutils --restart=Never \
#     -n microservice0 -- nslookup mysql.microservice0.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservice0.labels" (dict "name" "mysql" "component" "database") | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ required "mysql.externalName is required, e.g. --set mysql.externalName=<rds-endpoint>" .Values.mysql.externalName | quote }}
