apiVersion: v1
kind: Service
metadata:
  name: management
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservice0.labels" (dict "name" "management" "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: management
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
