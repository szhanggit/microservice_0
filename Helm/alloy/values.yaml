# Helm values for the grafana/alloy chart. Unlike install-alb-controller.sh/
# install-external-dns.sh's plain --set flags, this needs a real values file -
# Alloy's River config is too large for inline flags (same kind of deviation
# db-init/job.yaml already makes by skipping Helm entirely).
#
# All three backends here are Grafana Cloud (metrics/logs/traces) - Amazon
# Managed Prometheus was dropped (see terraform/modules/eks-amp's removal):
# Grafana Cloud's Prometheus data source doesn't expose AWS SigV4 auth on
# this account's plan, so querying AMP from Grafana Cloud was a dead end.
# Grafana Cloud's own hosted Prometheus (Mimir) takes basic_auth over
# remote_write instead, same shape as the Loki/Tempo pipelines below - no AWS
# IAM/IRSA involved anywhere in this chart anymore, so no envsubst step is
# needed either; this file is applied to Helm as-is.
#
# Alloy runs in DaemonSet mode (this chart's default) - one pod per node, same
# shape as xray-daemon. Each replica scopes itself to only the pods scheduled
# on its own node (via the NODE_NAME Downward API env var below, matched
# against __meta_kubernetes_pod_node_name) so metrics/logs aren't duplicated
# once per node.
alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
    - name: PROM_REMOTE_WRITE_URL
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: PROM_REMOTE_WRITE_URL
    - name: PROM_USERNAME
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: PROM_USERNAME
    - name: PROM_PASSWORD
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: PROM_PASSWORD
    - name: LOKI_PUSH_URL
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: LOKI_PUSH_URL
    - name: LOKI_USERNAME
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: LOKI_USERNAME
    - name: LOKI_PASSWORD
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: LOKI_PASSWORD
    - name: TEMPO_OTLP_ENDPOINT
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: TEMPO_OTLP_ENDPOINT
    - name: TEMPO_USERNAME
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: TEMPO_USERNAME
    - name: TEMPO_PASSWORD
      valueFrom:
        secretKeyRef:
          name: alloy-grafana-cloud-credentials
          key: TEMPO_PASSWORD

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP

  configMap:
    create: true
    content: |
      // Discover every pod on this node only - reused by both the
      // infra-metrics scrape and logs pipelines below so neither one
      // scrapes/ships the same pod once per DaemonSet replica.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods_same_node" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = env("NODE_NAME")
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      // --- Infra metrics: scrape pods on this node, remote_write to Grafana
      // Cloud Prometheus (Mimir). Only covers pods that expose their own
      // /metrics endpoint (coredns, cluster-autoscaler, external-dns, the
      // ALB controller, aws-node, Alloy itself, ...) - the microservice0
      // namespace is excluded here since those services don't implement a
      // scrapable /metrics endpoint. They push metrics via OTLP instead (see
      // the OTLP receiver below), so leaving them in this scrape would just
      // show every target permanently "down" for no actionable reason.
      discovery.relabel "scrape_targets" {
        targets = discovery.relabel.pods_same_node.output

        rule {
          source_labels = ["namespace"]
          regex         = "microservice0"
          action        = "drop"
        }
      }

      prometheus.scrape "kubernetes_pods" {
        targets    = discovery.relabel.scrape_targets.output
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      }

      prometheus.remote_write "grafana_cloud" {
        endpoint {
          url = env("PROM_REMOTE_WRITE_URL")

          basic_auth {
            username = env("PROM_USERNAME")
            password = env("PROM_PASSWORD")
          }
        }
      }

      // --- Logs: tail pods on this node, ship to Grafana Cloud Loki ---
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods_same_node.output
        forward_to = [loki.write.grafana_cloud.receiver]
      }

      loki.write "grafana_cloud" {
        endpoint {
          url = env("LOKI_PUSH_URL")

          basic_auth {
            username = env("LOKI_USERNAME")
            password = env("LOKI_PASSWORD")
          }
        }
      }

      // --- Traces + app metrics: receive OTLP from the .NET services.
      // Traces forward to Grafana Cloud Tempo; metrics are converted to
      // Prometheus format and forwarded into the same remote_write used by
      // the infra scrape above, reusing its existing Grafana Cloud Prometheus
      // credentials - no separate OTLP metrics endpoint/credentials needed.
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }

        output {
          metrics = [otelcol.exporter.prometheus.default.input]
          traces  = [otelcol.exporter.otlp.grafana_cloud.input]
        }
      }

      otelcol.exporter.prometheus "default" {
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      }

      otelcol.auth.basic "grafana_cloud" {
        username = env("TEMPO_USERNAME")
        password = env("TEMPO_PASSWORD")
      }

      otelcol.exporter.otlp "grafana_cloud" {
        client {
          endpoint = env("TEMPO_OTLP_ENDPOINT")
          auth     = otelcol.auth.basic.grafana_cloud.handler
        }
      }
