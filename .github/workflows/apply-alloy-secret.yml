name: Apply Alloy Secret

# Manual-only, rarely run - mirrors Helm/justfile's standalone
# apply-alloy-secret recipe (not part of the deploy chain there either).
# Only needed when rotating Grafana Cloud credentials or bootstrapping a
# fresh cluster's alloy-grafana-cloud-credentials Secret.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment whose cluster to update
        type: choice
        options: [develop, staging, production]
        default: develop

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  apply-alloy-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: extractions/setup-just@v2
      - uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        working-directory: Helm
        run: just update-kubeconfig "${{ inputs.environment }}"

      - name: Apply Alloy secret
        working-directory: Helm
        env:
          PROM_PASSWORD: ${{ secrets.PROM_PASSWORD }}
          LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
          TEMPO_PASSWORD: ${{ secrets.TEMPO_PASSWORD }}
        run: just apply-alloy-secret
