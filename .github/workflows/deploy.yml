name: Deploy

# Auto-deploys the `develop` environment whenever `develop` is merged into
# `master` (a push to master) - not on every push to develop directly, so
# work-in-progress commits on develop don't trigger a deploy, only the
# deliberate act of merging. staging/production only ever run via manual
# dispatch (never auto-deployed off a push). See Helm/justfile's deploy-all
# recipe - this workflow calls the same recipes in the same order, just as
# separate steps for easier per-stage debugging.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [develop, staging, production]
        default: develop
      tag:
        description: Image tag (blank = use this commit's short SHA, same default Helm/justfile's build-push uses)
        type: string
        default: ""

concurrency:
  group: microservice0-deploy-${{ inputs.environment || 'develop' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ca-central-1

jobs:
  # Runs first, before anything touches AWS. check-cluster/deploy both
  # transitively depend on this (see check-cluster's needs: below) via
  # needs:, so a test failure stops the whole pipeline immediately - neither
  # of those jobs starts at all. JobMonitorService has no test project
  # (nothing to run for it); the other three .NET services' solutions each
  # include both their unit and integration test projects - integration
  # tests run against a real in-memory SQLite database (see e.g.
  # tests/integration/Repositories/UserRepositoryTests.cs), no external
  # services needed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test UserRepositoryService (unit + integration)
        run: dotnet test components/UserRepositoryService/src/UserRepositoryService.sln

      - name: Test UserManagementService (unit + integration)
        run: dotnet test components/UserManagementService/src/UserManagementService.sln

      - name: Test UserManagementGateway (unit + integration)
        run: dotnet test components/UserManagementGateway/src/UserManagementGateway.sln

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: components/UserManagementWeb/package-lock.json

      - name: Install Angular dependencies
        working-directory: components/UserManagementWeb
        run: npm ci

      - name: Test UserManagementWeb
        working-directory: components/UserManagementWeb
        run: npm test -- --watch=false

  # Static code analysis (SAST) across all 4 .NET services + the Angular app,
  # runs in parallel with `test` (not serialized after it) since CodeQL
  # analysis across two languages takes a few minutes. Deliberately does NOT
  # gate check-cluster/deploy (no needs: wiring from those jobs to this one)
  # - unlike Trivy's image scan below, SAST findings need human triage
  # (false positives are common without an existing suppression/baseline
  # process), so this reports to the Security tab rather than blocking every
  # deploy on any alert.
  code-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript-typescript

      - name: Build .NET solutions for CodeQL
        run: |
          dotnet build components/UserRepositoryService/src/UserRepositoryService.sln
          dotnet build components/UserManagementService/src/UserManagementService.sln
          dotnet build components/UserManagementGateway/src/UserManagementGateway.sln
          dotnet build components/JobMonitorService/src/private/JobMonitorService/JobMonitorService.csproj

      - uses: github/codeql-action/analyze@v3

  # Separate job so a torn-down cluster shows as a clean "skipped" deploy job
  # in the Actions UI, not a wall of skipped steps - deploy-all assumes
  # terraform apply already ran for this environment (same assumption
  # Helm/justfile's own comment makes), which won't be true most of the time
  # given this project's cost-conscious "tear the cluster down between
  # sessions" pattern.
  check-cluster:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.vars.outputs.environment }}
      tag: ${{ steps.vars.outputs.tag }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment and image tag
        id: vars
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          if [ -z "$ENVIRONMENT" ]; then
            ENVIRONMENT="develop"
          fi

          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(git rev-parse --short HEAD)"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check whether the cluster exists
        id: check
        run: |
          if aws eks describe-cluster --name "microservice0-${{ steps.vars.outputs.environment }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cluster microservice0-${{ steps.vars.outputs.environment }} not found - terraform hasn't been applied for this environment right now, so deploy is being skipped (expected while the cluster is torn down between sessions, not a failure)."
          fi

  deploy:
    needs: check-cluster
    if: needs.check-cluster.outputs.exists == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      security-events: write
    env:
      ENVIRONMENT: ${{ needs.check-cluster.outputs.environment }}
      TAG: ${{ needs.check-cluster.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: extractions/setup-just@v2
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4

      - name: Update kubeconfig
        working-directory: Helm
        run: just update-kubeconfig "$ENVIRONMENT"

      - name: Install ALB controller
        working-directory: Helm
        run: just install-alb-controller "$ENVIRONMENT"

      - name: Install ExternalDNS
        working-directory: Helm
        run: just install-external-dns "$ENVIRONMENT"

      - name: Install Cluster Autoscaler
        working-directory: Helm
        run: just install-cluster-autoscaler "$ENVIRONMENT"

      - name: Install Alloy
        working-directory: Helm
        env:
          PROM_PASSWORD: ${{ secrets.PROM_PASSWORD }}
          LOKI_PASSWORD: ${{ secrets.LOKI_PASSWORD }}
          TEMPO_PASSWORD: ${{ secrets.TEMPO_PASSWORD }}
        run: just install-alloy "$ENVIRONMENT"

      - name: Build and push images
        working-directory: Helm
        run: just build-push "$ENVIRONMENT" "$TAG"

      - name: Resolve image URLs
        id: images
        run: |
          REPO_URLS_JSON="$(aws ssm get-parameter --name "/microservice0/$ENVIRONMENT/ecr_repository_urls" --region "${{ env.AWS_REGION }}" --query 'Parameter.Value' --output text)"
          echo "dataaccess=$(echo "$REPO_URLS_JSON" | jq -r '.userrepositoryservice'):$TAG" >> "$GITHUB_OUTPUT"
          echo "management=$(echo "$REPO_URLS_JSON" | jq -r '.usermanagementservice'):$TAG" >> "$GITHUB_OUTPUT"
          echo "gateway=$(echo "$REPO_URLS_JSON" | jq -r '.usermanagementgateway'):$TAG" >> "$GITHUB_OUTPUT"
          echo "jobmonitor=$(echo "$REPO_URLS_JSON" | jq -r '.jobmonitorservice'):$TAG" >> "$GITHUB_OUTPUT"

      # Gates the deploy, unlike code-scan above - vulnerable OS packages/
      # known-CVE base images are low-false-positive and genuinely shouldn't
      # ship, so exit-code: "1" fails this step (and therefore the job,
      # before deploy-app ever runs) on any CRITICAL/HIGH finding. Each
      # image's SARIF still uploads even if an earlier image already failed
      # the job, so partial results aren't lost - though scanning stops at
      # the first failing image (fail-fast, same philosophy as `test`).
      # ignore-unfixed: true skips CVEs with no available patch (e.g. the
      # aspnet:8.0 base image's zlib1g CVE-2023-45853, which Debian has
      # marked will_not_fix) - without it, the gate would fail every build
      # forever regardless of anything in this repo's own code/dependencies.
      - name: Scan dataaccess image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.dataaccess }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-dataaccess.sarif
      - name: Upload dataaccess scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dataaccess.sarif
          category: trivy-dataaccess

      - name: Scan management image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.management }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-management.sarif
      - name: Upload management scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-management.sarif
          category: trivy-management

      - name: Scan gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.gateway }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-gateway.sarif
      - name: Upload gateway scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-gateway

      - name: Scan jobmonitor image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.jobmonitor }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-jobmonitor.sarif
      - name: Upload jobmonitor scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-jobmonitor.sarif
          category: trivy-jobmonitor

      - name: Deploy app
        working-directory: Helm
        run: just deploy-app "$ENVIRONMENT" "$TAG"
