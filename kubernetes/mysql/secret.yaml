# MySQL is AWS RDS (managed externally) - there is no mysql Deployment/Service
# in this cluster. This Secret is the only thing this folder holds: it's what
# lets `dataaccess` (UserRepositoryService) connect to that RDS instance.
#
# The value below is a PLACEHOLDER. Before applying to a real cluster, replace
# it with the actual RDS endpoint/credentials, e.g.:
#
#   kubectl create secret generic dataaccess-db-credentials \
#     --namespace microservice0 \
#     --from-literal=ConnectionStrings__MySql="Server=<rds-endpoint>;Port=3306;Database=userdb;User=<user>;Password=<password>;" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# In Phase 8, Terraform's RDS module output should feed this value instead of
# a hand-typed one. Never commit real credentials to this file.
apiVersion: v1
kind: Secret
metadata:
  name: dataaccess-db-credentials
  namespace: microservice0
  labels:
    app.kubernetes.io/name: dataaccess
    app.kubernetes.io/part-of: microservice0
    app.kubernetes.io/component: database-credentials
type: Opaque
stringData:
  ConnectionStrings__MySql: "Server=<rds-endpoint>;Port=3306;Database=userdb;User=<user>;Password=<password>;"
