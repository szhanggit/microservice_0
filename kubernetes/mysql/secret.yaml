# MySQL is AWS RDS (managed externally) - there is no mysql Deployment/Service
# in this cluster. This Secret is the only thing this folder holds: it's what
# lets `dataaccess` (UserRepositoryService) connect to that RDS instance.
#
# The value below is a PLACEHOLDER, used only if you `kubectl apply -f` this
# file directly. Once terraform/ has provisioned the real RDS instance, run
# terraform/scripts/apply-db-secret.sh instead (also called automatically by
# deploy-app.sh) - it overwrites this Secret with the real endpoint/master
# credentials read straight from `terraform output db_connection_string`.
# Never commit real credentials to this file.
apiVersion: v1
kind: Secret
metadata:
  name: dataaccess-db-credentials
  namespace: microservice0
  labels:
    app.kubernetes.io/name: dataaccess
    app.kubernetes.io/part-of: microservice0
    app.kubernetes.io/component: database-credentials
type: Opaque
stringData:
  ConnectionStrings__MySql: "Server=<rds-endpoint>;Port=3306;Database=userdb;User=<user>;Password=<password>;"
