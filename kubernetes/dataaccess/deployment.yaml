apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataaccess
  namespace: microservice0
  labels:
    app.kubernetes.io/name: dataaccess
    app.kubernetes.io/part-of: microservice0
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dataaccess
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dataaccess
        app.kubernetes.io/part-of: microservice0
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: dataaccess
          # Substituted by kubernetes/scripts/deploy-app.sh (envsubst) with the
          # real ECR repository URL read from SSM Parameter Store (see
          # terraform/ssm-outputs.tf). For a plain `kubectl apply -f` without
          # that script, replace this with a literal
          # <account-id>.dkr.ecr.<region>.amazonaws.com/microservice0/userrepositoryservice:<tag>.
          image: ${DATAACCESS_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8080
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: dataaccess-config
            - secretRef:
                name: dataaccess-db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
