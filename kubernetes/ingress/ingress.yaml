# Routes external traffic to the gateway Service only - dataaccess and management
# are internal-only gRPC services and are never exposed outside the cluster.
#
# ingressClassName: alb targets the AWS Load Balancer Controller (provisioned
# via terraform/modules/eks-alb-controller + terraform/scripts/install-alb-controller.sh),
# which creates a real internet-facing Application Load Balancer for this
# Ingress. No `host` rule is set since no Route53 domain is wired up in this
# project (see terraform/modules/eks-external-dns) - traffic is routed by
# path only, reachable at the ALB's own DNS name:
#   kubectl get ingress -n microservice0 microservice0 -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
#
# If you do have a domain + Route53 hosted zone, add back a `host:` rule and
# an `external-dns.alpha.kubernetes.io/hostname` annotation - ExternalDNS is
# already provisioned and will pick it up automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice0
  namespace: microservice0
  labels:
    app.kubernetes.io/part-of: microservice0
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
