# Routes external traffic to the gateway Service only - dataaccess and management
# are internal-only gRPC services and are never exposed outside the cluster.
#
# ingressClassName: alb targets the AWS Load Balancer Controller (its IAM role
# provisioned via terraform/modules/eks-alb-controller, the controller itself
# installed via kubernetes/scripts/install-alb-controller.sh), which creates a
# real internet-facing Application Load Balancer for this Ingress. No `host`
# rule is set since no Route53 domain is wired up in this project (see
# terraform/modules/eks-external-dns) - traffic is routed by path only,
# reachable at the ALB's own DNS name:
#   kubectl get ingress -n microservice0 microservice0 -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
#
# If you do have a domain + Route53 hosted zone, add back a `host:` rule and
# an `external-dns.alpha.kubernetes.io/hostname` annotation - ExternalDNS is
# already provisioned and will pick it up automatically.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice0
  namespace: microservice0
  labels:
    app.kubernetes.io/part-of: microservice0
  annotations:

    # Load Balancer Name
    alb.ingress.kubernetes.io/load-balancer-name: microservice0-ingress
    # Health Check Settings
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP 
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    #Important Note:  Need to add health check path annotations in service level if we are planning to use multiple targets in a load balancer    
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'  
    ## SSL Settings
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ca-central-1:286664220642:certificate/79114ecf-5ba1-4fac-a025-4709372825fe
    # SSL Redirect Setting
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # External DNS - For creating a Record Set in Route53
    external-dns.alpha.kubernetes.io/hostname: microservice0.ekslab.xyz

    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
