# Routes external traffic to the gateway Service only - dataaccess and management
# are internal-only gRPC services and are never exposed outside the cluster.
#
# ingressClassName: nginx targets a locally-installable controller so this can be
# verified on kind/minikube per the todo's "verify on local cluster (optional)"
# note. Swap to the AWS Load Balancer Controller's annotations/class once Phase 8
# actually provisions EKS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice0
  namespace: microservice0
  labels:
    app.kubernetes.io/part-of: microservice0
spec:
  ingressClassName: nginx
  rules:
    - host: microservice0.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
