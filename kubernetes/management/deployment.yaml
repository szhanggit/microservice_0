apiVersion: apps/v1
kind: Deployment
metadata:
  name: management
  namespace: microservice0
  labels:
    app.kubernetes.io/name: management
    app.kubernetes.io/part-of: microservice0
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: management
        app.kubernetes.io/part-of: microservice0
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: management
          # TODO(Phase 8): replace with the ECR image URI once Terraform provisions it.
          image: usermanagementservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 8080
            - name: health
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: management-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
