apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: microservice0
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: microservice0
    app.kubernetes.io/component: frontend
data:
  # Development also enables Swagger UI (Program.cs gates it on IsDevelopment()).
  # Flip to "Development" if you want Swagger reachable during demo/local verification.
  ASPNETCORE_ENVIRONMENT: "Development"
  GrpcClients__UserManagementService: "http://management.microservice0.svc.cluster.local:8080"
  AWS_XRAY_DAEMON_ADDRESS: "xray-daemon.default.svc.cluster.local:2000"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.default.svc.cluster.local:4317"
