apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: microservice0
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: microservice0
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: microservice0
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: gateway
          # Substituted by kubernetes/scripts/deploy-app.sh (envsubst) with the
          # real ECR repository URL read from SSM Parameter Store (see
          # terraform/ssm-outputs.tf). For a plain `kubectl apply -f` without
          # that script, replace this with a literal
          # <account-id>.dkr.ecr.<region>.amazonaws.com/microservice0/usermanagementgateway:<tag>.
          image: ${GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
